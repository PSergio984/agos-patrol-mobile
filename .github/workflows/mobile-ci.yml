name: Mobile CI

on:
  push:
    branches:
      - main
      - 'feat/**'
    paths:
      - 'apps/responder/**'
      - '.github/workflows/mobile-ci.yml'
      - '.github/actions/setup-mobile/**'
  pull_request:
    branches:
      - main
      - 'feat/**'
    paths:
      - 'apps/responder/**'
      - '.github/workflows/mobile-ci.yml'
      - '.github/actions/setup-mobile/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck:
    name: Lint and typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up mobile environment
        uses: ./.github/actions/setup-mobile

      - name: Typecheck
        working-directory: apps/responder
        run: npx tsc --noEmit

      - name: Lint
        working-directory: apps/responder
        run: npx eslint .

      - name: Format check
        working-directory: apps/responder
        run: npx prettier --check .

  sonarcloud:
    name: SonarCloud scan
    runs-on: ubuntu-latest
    needs: lint-typecheck
    if: vars.SONARCLOUD_ENABLED == 'true'
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: SonarCloud scan
        # sonarcloud-github-action is archived; the maintained replacement is
        # sonarqube-scan-action (pinned to the v8.2.1 commit — same pin as
        # the CEIT-Library workflows, auditable and supply-chain safe).
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONARQUBE_TOKEN }}
